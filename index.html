<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#120b16" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Handjet:wght,ELSH@100..900,2&display=swap" rel="stylesheet" />
  <meta name="description" content="A fresh bouquet, picked just for you." />
  <meta property="og:title" content="Flowers for you ♥" />
  <meta property="og:description" content="A fresh bouquet, picked just for you." />
  <meta property="og:type" content="website" />
  <title>Flowers for you</title>
  <style>
    :root {
      --bg: #120b16;
      --bg-2: #1c1226;
      --ink: #f6e7f4;
      --ink-soft: #cbb3d1;
      --accent: #e56ba3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background-color: #120b16; }
    html, body { height: 100%; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(120% 90% at 50% 0%, var(--bg-2) 0%, var(--bg) 60%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100%;
      min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) 8px max(20px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    #stage {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: center;
      padding: 10px 4px 4px;
    }
    pre#bouquet {
      font-family: "Handjet", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre;
      line-height: 1;
      letter-spacing: 0;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    #quote-wrap {
      width: 100%;
      max-width: 620px;
      text-align: center;
      padding: 22px 20px 10px;
    }
    #quote {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 19px;
      line-height: 1.45;
      color: var(--ink);
      text-wrap: balance;
    }
    #quote-author {
      margin-top: 12px;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
    }
    #cell-measure { position: absolute; left: -9999px; top: 0; white-space: pre; }
    footer {
      margin-top: auto;
      padding-top: 18px;
      font-size: 12px;
      color: var(--ink-soft);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <span id="cell-measure" aria-hidden="true"></span>
  <div id="stage"><pre id="bouquet" aria-label="A bouquet of flowers made of text characters"></pre></div>

  <div id="quote-wrap">
    <p id="quote"></p>
    <p id="quote-author"></p>
  </div>

  <footer>Siempre tuyo, Aleix</footer>

  <script src="quotes.js"></script>
  <script src="bouquet.js"></script>
</body>
</html>
