# Example nginx server block for flowers-for-you (static site).
# Drop into /etc/nginx/sites-available/, symlink into sites-enabled/,
# then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;

    # Your domain, or "_" to serve on the bare server IP.
    server_name _;

    root /var/www/flowers-for-you;
    index index.html;

    # Cache static assets lightly; the HTML itself is small and re-fetched
    # each visit so a new bouquet + quote appear on every reload.
    location ~* \.(js|html)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # gzip the JS/HTML
    gzip on;
    gzip_types text/html application/javascript text/css;
}
